name: Deploy Aparna Landing

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: prod
        type: choice
        options:
          - stage
          - prod

permissions:
  contents: read

env:
  APARNA_SERVER_HOST: 37.32.22.56
  STAGE_APP_DIR: /opt/apartment-bot-stage
  PROD_APP_DIR: /opt/apartment-bot-prod

jobs:
  deploy:
    name: Deploy static files
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare target
        id: target
        shell: bash
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment }}
        run: |
          if [[ "${DEPLOY_ENV}" == "stage" ]]; then
            echo "target_dir=${STAGE_APP_DIR}/web/landing" >> "$GITHUB_OUTPUT"
          elif [[ "${DEPLOY_ENV}" == "prod" ]]; then
            echo "target_dir=${PROD_APP_DIR}/web/landing" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported DEPLOY_ENV=${DEPLOY_ENV}" >&2
            exit 1
          fi

      - name: Deploy over SSH
        shell: bash
        env:
          APARNA_SERVER_USER: ${{ secrets.APARNA_SERVER_USER }}
          APARNA_SERVER_SSH_KEY: ${{ secrets.APARNA_SERVER_SSH_KEY }}
          TARGET_DIR: ${{ steps.target.outputs.target_dir }}
        run: |
          set -euo pipefail

          : "${APARNA_SERVER_USER:?APARNA_SERVER_USER is required}"
          : "${APARNA_SERVER_SSH_KEY:?APARNA_SERVER_SSH_KEY is required}"

          ssh_dir="${RUNNER_TEMP}/aparna-ssh"
          key_path="${ssh_dir}/deploy_key"
          known_hosts_path="${ssh_dir}/known_hosts"
          bundle_path="${RUNNER_TEMP}/aparna-landing.tar.gz"
          remote="${APARNA_SERVER_USER}@${APARNA_SERVER_HOST}"
          remote_bundle="/tmp/aparna-landing-${GITHUB_SHA::8}.tar.gz"

          install -m 700 -d "${ssh_dir}"
          printf '%s\n' "${APARNA_SERVER_SSH_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          ssh-keyscan -T 30 -H "${APARNA_SERVER_HOST}" > "${known_hosts_path}"

          tar -czf "${bundle_path}" index.html styles.css script.js assets

          ssh_opts=(
            -i "${key_path}"
            -o UserKnownHostsFile="${known_hosts_path}"
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=120
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          scp "${ssh_opts[@]}" "${bundle_path}" "${remote}:${remote_bundle}"
          ssh "${ssh_opts[@]}" "${remote}" "REMOTE_BUNDLE='${remote_bundle}' TARGET_DIR='${TARGET_DIR}' bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail

          tmp_extract="$(mktemp -d)"
          cleanup() {
            rm -rf "${tmp_extract}"
            rm -f "${REMOTE_BUNDLE}"
          }
          trap cleanup EXIT

          tar -xzf "${REMOTE_BUNDLE}" -C "${tmp_extract}"
          mkdir -p "${TARGET_DIR}"
          find "${TARGET_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R "${tmp_extract}/." "${TARGET_DIR}/"
          find "${TARGET_DIR}" -type d -exec chmod 755 {} +
          find "${TARGET_DIR}" -type f -exec chmod 644 {} +
          REMOTE_SCRIPT
